{{- if eq (include "capov-cluster.csiSecretWanted" .) "true" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "capov-cluster.csiSecretName" . }}
  namespace: {{ .Release.Name }}
  labels:
    {{- include "capov-cluster.labels" . | nindent 4 }}
type: Opaque
data:
  data: {{ include "capov-cluster.csiConfigYaml" . | b64enc | quote }}
{{- end }}

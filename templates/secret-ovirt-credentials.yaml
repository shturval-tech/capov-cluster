apiVersion: v1
kind: Secret
metadata:
  name: {{ include "capov-cluster.credentialsSecretName" . }}
  namespace: capov-system
  labels:
    {{- include "capov-cluster.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.capov.username | b64enc | quote }}
  password: {{ .Values.capov.password | b64enc | quote }}

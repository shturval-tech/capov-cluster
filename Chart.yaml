apiVersion: v2
name: capov-cluster
description: Helm-чарт для развёртывания Cluster API-кластера на провайдере oVirt (CAPOV) + Shturval ClusterConfig
type: application
version: 0.3.1
appVersion: "2.15.0"
dependencies:
  - name: capsm-cluster-vm
    alias: capov-cluster-vm
    version: 0.1.0
    repository: capsm-cluster-vm
    condition: capov-cluster-vm.enable
  - name: capsm-cluster-grafana
    alias: capov-cluster-grafana
    version: 0.1.0
    repository: capsm-cluster-grafana
    condition: capov-cluster-grafana.enable
